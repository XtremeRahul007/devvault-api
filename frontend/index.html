<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DevVault</title>
    <script>
      (function () {
        savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
          document.documentElement.dataset.theme = savedTheme;
          return;
        }
        const systemTheme = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const currentTheme = systemTheme ? "dark" : "light";
        document.documentElement.dataset.theme = currentTheme;
        localStorage.setItem("theme", currentTheme);
      })();
    </script>
  </head>

  <body class="flex flex-col BODY">
    <header class="p-2">
      <section
        class="flex justify-between items-center bg-(--primary-bg) p-2 px-2.5 rounded-lg depth-container"
      >
        <h1 class="text-4xl font-bold text-(--primary-color)">DevVault</h1>
        <div class="flex flex-row gap-2">
          <button class="primary-button depth-box" id="themeSwitch">
            <span class="svg-gr svg-size-md" id="themeIcon"></span>
          </button>
        </div>
      </section>
    </header>
    <main class="flex flex-col flex-1 min-h-0 text-xl">
      <section class="flex flex-row px-2">
        <form
          id="searchForm"
          class="flex flex-row gap-2 bg-(--primary-bg) depth-container rounded-lg p-2 w-full"
        >
          <div
            class="flex flex-row flex-1 primary-inset-container rounded-md px-1"
          >
            <input
              id="searchBar"
              type="search"
              name="Search"
              class="outline-none placeholder:text-zinc-400 text-(--tertiary-color) py-1 px-2 flex-1"
              placeholder="Search..."
              autocomplete="off"
            />
          </div>
          <button
            type="reset"
            class="primary-button depth-box active:scale-90 transition-transform duration-150 ease-in-out"
          >
            <span id="resetIcon" class="svg-gr svg-size-sm" />
          </button>
          <button
            type="button"
            class="primary-button depth-box"
            popovertarget="extensionMenu"
          >
            <span class="svg-gr svg-size-sm svg-extensionFilter" />
          </button>
        </form>
      </section>
      <section class="flex-1 flex flex-col min-h-0 p-2">
        <div
          class="flex flex-col gap-2 bg-(--primary-bg) rounded-lg p-2 depth-container flex-1 min-h-0"
        >
          <div class="flex justify-between items-center">
            <div class="flex flex-row gap-2 items-baseline">
              <h1 class="text-xl font-medium text-(--secondary-color)">
                All Files
              </h1>
              <div class="text-zinc-400 text-xs" id="fileCounterContainer">
                Files Selected: 0
              </div>
            </div>

            <div id="buttonPanel" class="flex flex-row gap-2"></div>
          </div>
          <ul
            class="primary-list primary-inset-container rounded-md flex-1 min-h-0 overflow-y-auto scrollbar-thin scrollbar-thumb-(--tertiary-color)"
            id="fileList"
          ></ul>
        </div>
      </section>
    </main>
    <footer></footer>
    <script defer type="module" src="./src/main.ts"></script>
  </body>
</html>
